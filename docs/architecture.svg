<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-label="Architecture of the serverless image processing pipeline">
  <rect width="1200" height="1120" fill="#f6f4ef"/>
  <text x="40" y="46" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="650" fill="#1c1917">Serverless image processing pipeline</text>
  <text x="40" y="74" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#78716c">Upload, queue, process, then deliver</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="40" y="112" font-size="13" font-weight="700" fill="#a8a29e">1 · UPLOAD</text>

    <rect x="40" y="128" width="156" height="84" rx="10" fill="#1c1917"/>
    <text x="118" y="176" text-anchor="middle" fill="#faf7f2" font-size="16" font-weight="650">Client</text>

    <rect x="268" y="128" width="190" height="84" rx="10" fill="#5b3cc4"/>
    <text x="363" y="176" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="650">API Gateway</text>

    <rect x="530" y="128" width="210" height="84" rx="10" fill="#c2410c"/>
    <text x="635" y="166" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="650">Lambda</text>
    <text x="635" y="188" text-anchor="middle" fill="#ffedd5" font-size="13">presigned URL</text>

    <rect x="840" y="128" width="200" height="84" rx="10" fill="#1d4ed8"/>
    <text x="940" y="166" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="650">DynamoDB</text>
    <text x="940" y="188" text-anchor="middle" fill="#dbeafe" font-size="13">awaiting upload</text>

    <path d="M196 170 H260" stroke="#44403c" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
    <path d="M458 170 H522" stroke="#44403c" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
    <path d="M740 170 H832" stroke="#44403c" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
    <text x="228" y="158" text-anchor="middle" fill="#57534e" font-size="12">POST</text>
    <text x="490" y="158" text-anchor="middle" fill="#57534e" font-size="12">invoke</text>
    <text x="786" y="158" text-anchor="middle" fill="#57534e" font-size="12">save status</text>

    <path d="M118 212 V292" stroke="#44403c" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
    <text x="132" y="258" fill="#57534e" font-size="13">presigned PUT</text>

    <text x="330" y="276" font-size="13" font-weight="700" fill="#a8a29e">2 · QUEUE</text>

    <rect x="40" y="300" width="230" height="84" rx="10" fill="#3f6212"/>
    <text x="155" y="338" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="650">S3 source bucket</text>
    <text x="155" y="360" text-anchor="middle" fill="#ecfccb" font-size="13">private, SSE-S3</text>

    <rect x="330" y="300" width="176" height="84" rx="10" fill="#9d174d"/>
    <text x="418" y="348" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="650">SQS queue</text>

    <rect x="566" y="300" width="220" height="84" rx="10" fill="#c2410c"/>
    <text x="676" y="338" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="650">Lambda</text>
    <text x="676" y="360" text-anchor="middle" fill="#ffedd5" font-size="13">start workflow</text>

    <path d="M270 342 H322" stroke="#44403c" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
    <path d="M506 342 H558" stroke="#44403c" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
    <text x="296" y="330" text-anchor="middle" fill="#57534e" font-size="12">event</text>
    <text x="532" y="330" text-anchor="middle" fill="#57534e" font-size="12">poll</text>

    <path d="M418 384 V428" stroke="#44403c" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
    <text x="432" y="412" fill="#57534e" font-size="13">after 3 failed tries</text>

    <rect x="330" y="436" width="176" height="68" rx="10" fill="#7f1d1d"/>
    <text x="418" y="476" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="650">Dead-letter queue</text>

    <text x="40" y="548" font-size="13" font-weight="700" fill="#a8a29e">3 · PROCESS</text>
    <rect x="40" y="564" width="1120" height="188" rx="14" fill="#fffdf8" stroke="#9d174d" stroke-width="1.6" stroke-dasharray="7 5"/>
    <text x="64" y="598" fill="#9d174d" font-size="16" font-weight="700">Step Functions</text>

    <rect x="150" y="622" width="190" height="72" rx="8" fill="#fff7ed" stroke="#c2410c"/>
    <text x="245" y="664" text-anchor="middle" fill="#9a3412" font-size="16" font-weight="650">Validate</text>
    <rect x="400" y="622" width="190" height="72" rx="8" fill="#fff7ed" stroke="#c2410c"/>
    <text x="495" y="664" text-anchor="middle" fill="#9a3412" font-size="16" font-weight="650">Resize</text>
    <rect x="650" y="622" width="190" height="72" rx="8" fill="#fff7ed" stroke="#c2410c"/>
    <text x="745" y="664" text-anchor="middle" fill="#9a3412" font-size="16" font-weight="650">Watermark</text>
    <rect x="900" y="622" width="190" height="72" rx="8" fill="#fff7ed" stroke="#c2410c"/>
    <text x="995" y="664" text-anchor="middle" fill="#9a3412" font-size="16" font-weight="650">Store</text>

    <path d="M340 658 H392" stroke="#c2410c" stroke-width="1.7" fill="none" marker-end="url(#arrow-hot)"/>
    <path d="M590 658 H642" stroke="#c2410c" stroke-width="1.7" fill="none" marker-end="url(#arrow-hot)"/>
    <path d="M840 658 H892" stroke="#c2410c" stroke-width="1.7" fill="none" marker-end="url(#arrow-hot)"/>
    <text x="600" y="728" text-anchor="middle" fill="#78716c" font-size="13">Image bytes stay in S3. The workflow carries the object key only.</text>

    <text x="360" y="792" font-size="13" font-weight="700" fill="#a8a29e">4 · DELIVER</text>

    <path d="M155 752 V836" stroke="#44403c" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
    <path d="M860 752 V836" stroke="#44403c" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
    <path d="M1088 752 V836" stroke="#44403c" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
    <text x="168" y="800" fill="#57534e" font-size="13">processed files</text>
    <text x="872" y="800" fill="#57534e" font-size="13">notify</text>
    <text x="1076" y="800" text-anchor="end" fill="#57534e" font-size="13">save URLs</text>

    <rect x="40" y="844" width="230" height="84" rx="10" fill="#3f6212"/>
    <text x="155" y="882" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="650">S3 destination</text>
    <text x="155" y="904" text-anchor="middle" fill="#ecfccb" font-size="13">images/ prefix</text>

    <rect x="318" y="844" width="190" height="84" rx="10" fill="#5b3cc4"/>
    <text x="413" y="882" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="650">CloudFront</text>
    <text x="413" y="904" text-anchor="middle" fill="#ede9fe" font-size="13">OAC, HTTPS</text>

    <rect x="556" y="844" width="160" height="84" rx="10" fill="#1c1917"/>
    <text x="636" y="892" text-anchor="middle" fill="#faf7f2" font-size="16" font-weight="650">Viewers</text>

    <rect x="770" y="844" width="180" height="84" rx="10" fill="#9d174d"/>
    <text x="860" y="892" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="650">SNS topic</text>

    <rect x="996" y="844" width="184" height="84" rx="10" fill="#1d4ed8"/>
    <text x="1088" y="882" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="650">DynamoDB</text>
    <text x="1088" y="904" text-anchor="middle" fill="#dbeafe" font-size="13">status and URLs</text>

    <path d="M270 886 H310" stroke="#44403c" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
    <path d="M508 886 H548" stroke="#44403c" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>

    <text x="40" y="972" font-size="13" font-weight="700" fill="#a8a29e">GUARDS</text>

    <rect x="40" y="988" width="270" height="96" rx="10" fill="#ffffff" stroke="#e7e5e4"/>
    <text x="56" y="1016" fill="#1c1917" font-size="14" font-weight="700">Access</text>
    <text x="56" y="1040" fill="#57534e" font-size="13">One IAM role per function.</text>
    <text x="56" y="1060" fill="#57534e" font-size="13">Upload URL expires in 5 minutes.</text>

    <rect x="326" y="988" width="270" height="96" rx="10" fill="#ffffff" stroke="#e7e5e4"/>
    <text x="342" y="1016" fill="#1c1917" font-size="14" font-weight="700">Privacy</text>
    <text x="342" y="1040" fill="#57534e" font-size="13">Both buckets block public access.</text>
    <text x="342" y="1060" fill="#57534e" font-size="13">CloudFront is the only reader.</text>

    <rect x="612" y="988" width="270" height="96" rx="10" fill="#ffffff" stroke="#e7e5e4"/>
    <text x="628" y="1016" fill="#1c1917" font-size="14" font-weight="700">Encryption</text>
    <text x="628" y="1040" fill="#57534e" font-size="13">SSE-S3 and the SQS managed key.</text>
    <text x="628" y="1060" fill="#57534e" font-size="13">DynamoDB uses its owned key.</text>

    <rect x="898" y="988" width="262" height="96" rx="10" fill="#ffffff" stroke="#e7e5e4"/>
    <text x="914" y="1016" fill="#1c1917" font-size="14" font-weight="700">Retention</text>
    <text x="914" y="1040" fill="#57534e" font-size="13">Lifecycle expires old objects.</text>
    <text x="914" y="1060" fill="#57534e" font-size="13">CloudWatch alarms the DLQ.</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 Z" fill="#44403c"/>
    </marker>
    <marker id="arrow-hot" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 Z" fill="#c2410c"/>
    </marker>
  </defs>
</svg>
